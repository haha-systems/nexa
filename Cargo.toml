[package]
name = "nexa"
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
description = "The Nexa reference implementation: typed programs, memories, and authorized effects"
publish = false

[dependencies]
clap = { version = "4.5", features = ["derive"] }
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
default = []
http-client = ["dep:reqwest"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
